databases:
  - id: mssql_live
    uri: ${MSSQL_DATABASE_URL}

retrieval:
  top_k: 400
  min_score: 0.0

execution:
  max_rows: 500
  default_limit: 100
  read_only: true

llm:
  provider: openai_compatible
  base_url: http://127.0.0.1:11434/v1
  model: gemma4:31b-cloud
  temperature: 0.1
  max_tokens: 1024
  # Rules, table mappings, and prompt conditions are dynamically managed in database table dbo.NLP_SQL_Rules.
  # You can also add optional static instructions below if needed:
  custom_instructions: ""

# Opaque capability tokens — LLM never sees client secrets or who owns access
auth:
  token_ttl_seconds: 3600
  clients:
    - client_id: customer_portal
      client_secret: qwerty
      databases:
        - id: mssql_live
          tables: "*"

server:
  serve_chat_ui: true
  cors_origins:
    - http://127.0.0.1:8000
    - http://localhost:8000
