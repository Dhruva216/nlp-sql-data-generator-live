databases:
  - id: mssql_live
    uri: ${MSSQL_DATABASE_URL}

retrieval:
  top_k: 400
  min_score: 0.0

execution:
  max_rows: 500
  default_limit: 100
  read_only: true

llm:
  provider: openai_compatible
  base_url: http://127.0.0.1:11434/v1
  model: gemma4:31b-cloud
  temperature: 0.1
  max_tokens: 1024
  # Add custom instructions or few-shot examples here to optimize queries for your database.
  custom_instructions: |
    - Always qualify column names with their table name to avoid ambiguity.
    - If the user asks about the database name or active database, use: SELECT DB_NAME() as database_name;
    - For gender queries, select u.FirstName, u.LastName, s.StudentGenderCodeId AS Gender from dbo.UserInfo AS u JOIN dbo.Student AS s ON u.UserId = s.UserId. Do not query or subquery dbo.Code or dbo.List.
    - For attendance status columns (e.g. SIS_Attendance.Status), use a CASE statement to display 'Present' or 'Absent' instead of raw true/false or 1/0: CASE WHEN Attendance.Status = 1 OR Attendance.Status = 'true' THEN 'Present' ELSE 'Absent' END AS Status.
    - When student fees, payments, or financial details are requested, query dbo.SIS_Accounting_Financials_T and join with dbo.UserInfo (or dbo.Student) on dbo.SIS_Accounting_Financials_T.ApplyAmountToId = dbo.UserInfo.UserId to retrieve student names alongside fee details.
    - When student grade points, test points, or max marks are requested, query dbo.SIS_Student_Course_Test_Enrollment AS cte LEFT JOIN dbo.SIS_Course_Grades AS cg ON cg.CourseGradeId = cte.TestId LEFT JOIN dbo.Class AS cl ON cte.CourseId = cl.ClassId LEFT JOIN dbo.Student AS s ON s.UserId = cte.UserId LEFT JOIN dbo.UserInfo AS u ON u.UserId = cte.UserId. Filter with (s.StudentNumber = '<num>' OR s.LegacyStudentId = '<num>'). Select cte.Points AS TotalPoints, cg.MaxPoints AS TotalMaxMarks, cg.GradeName, cl.ClassDesc, s.StudentNumber, s.LegacyStudentId, and u.FirstName + ' ' + u.LastName AS Name.
    - Subject table in database is dbo.Class. When subject is requested, query dbo.Class.
    - Class table in database is dbo.SIS_Program. When class or program is requested, query dbo.SIS_Program.
    - Class Students table is dbo.SIS_Student_Program. When class students or class enrollments are requested, query dbo.SIS_Student_Program.
    - When full or individual student profile/details/homeworks are requested for a specific student, call stored procedure dbo.SIS_Students_GetStudentDetailsByUserId: (1) DECLARE @UserId INT = (SELECT TOP 1 UserId FROM dbo.UserInfo WHERE FirstName = '<first>' AND LastName = '<last>'); (2) EXEC dbo.SIS_Students_GetStudentDetailsByUserId @UserId = @UserId, @StudentStatusID = NULL, @GenderListId = NULL, @TeacherRoleId = NULL, @NameTitle = NULL, @AddressTypeListId = NULL, @StudentProgramStatusListID = NULL, @StudentCredentialAwarded = NULL, @StudentCredentialStatus = NULL, @StudentStatusListId = NULL, @PaymentMethods = NULL, @StudentApplyAmountTo = NULL, @CustomFieldsStudent = NULL, @LicensureExamNameListId = NULL, @LicensureExamStatusListId = NULL, @StudentJobPlacementWagesListId = NULL, @StudentJobPlacementEmploymentHoursListId = NULL. For attendance, also query dbo.SIS_Attendance. For fees, also query dbo.SIS_Accounting_Financials_T.

# Opaque capability tokens — LLM never sees client secrets or who owns access
auth:
  token_ttl_seconds: 3600
  clients:
    - client_id: customer_portal
      client_secret: qwerty
      databases:
        - id: mssql_live
          tables: "*"

server:
  serve_chat_ui: true
  cors_origins:
    - http://127.0.0.1:8000
    - http://localhost:8000
